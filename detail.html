<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail View — Dream To Build</title>
  
  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Cinzel:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- BRAND HEADER -->
  <header class="site-header">
    <div class="brand-title">
      <span class="font-dream">Dream</span>
      <span class="font-to">to</span>
      <span class="font-build">BUILD</span>
    </div>
    <div class="site-tagline">Dragging high-concept pretty pictures kicking and screaming into the real world.</div>
  </header>

  <!-- NAVIGATION RETURN LINK -->
  <nav class="detail-nav">
    <a href="index.html" class="back-link">&larr; Back to Gallery</a>
  </nav>

  <!-- DYNAMIC LAYOUT CONTAINER -->
  <main id="detail-main-container" class="main-layout flex-column">

    <!-- LEFT COLUMN: TECHNICAL SPECIFICATIONS -->
    <aside id="detail-specs-container" class="sidebar-nav" style="display:none; padding: 16px;">
      <span class="nav-label">Technical Specs</span>
      <dl id="detail-specs-list" class="spec-details" style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;"></dl>
    </aside>

    <!-- CENTER / MAIN CONTENT FRAME -->
    <section id="center-frame" style="display: flex; flex-direction: column; gap: 24px; min-width: 0; flex: 1;">
      
      <!-- Hero Spotlight Frame -->
      <div id="spotlight-frame" style="background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden;">
        <div class="spotlight-media" style="width: 100%; height: 420px; background-color: #050608; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer;" onclick="openLightbox(document.getElementById('detail-hero-img').src, document.getElementById('detail-title').textContent)">
          <img id="detail-hero-img" src="" alt="Hero Preview" style="max-width: 100%; max-height: 100%; object-fit: contain;">
        </div>
        <div class="spotlight-caption" style="padding: 18px 22px; border-top: 1px solid var(--border-color);">
          <h2 id="detail-title" style="font-family: var(--font-to); font-size: 1.45rem; color: #ffffff; margin-bottom: 6px;">Loading Title...</h2>
          <p id="detail-subtitle" class="card-subtitle" style="font-family: var(--font-spec); color: var(--accent-cyan);">Loading Subtitle...</p>
        </div>
      </div>

      <!-- Narrative / Overview Content -->
      <div id="detail-narrative" class="detail-narrative" style="background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 24px;">
        <h2 style="font-family: var(--font-to); font-size: 1.6rem; color: #ffffff; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">Overview & Design Intent</h2>
        <div id="detail-content">Loading description...</div>
      </div>

      <!-- Active Sub-Gallery / Builder Content Display (Projects Only) -->
      <div id="active-tab-display" style="background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 24px; display: none;">
        <!-- Dynamically rendered sub-gallery or password gate -->
      </div>

      <!-- Standard Flat Gallery Grid (Dreams, Fantasies, About) -->
      <div id="standard-gallery-container" style="background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 24px; display: none;">
        <h2 style="font-family: var(--font-to); font-size: 1.4rem; color: #ffffff; margin-bottom: 16px;">Gallery</h2>
        <div id="standard-gallery-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px;"></div>
      </div>

    </section>

    <!-- RIGHT COLUMN: VERTICAL NAVIGATION SIDEBAR (PROJECTS ONLY) -->
    <aside id="sidebar-nav-right" class="sidebar-nav" style="display: none; padding: 16px;">
      <span class="nav-label">Project Sections</span>
      <div id="gallery-tabs" style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
        <!-- Vertical buttons populated dynamically for Projects -->
      </div>
    </aside>

  </main>

  <!-- FULLSCREEN LIGHTBOX MODAL -->
  <div id="lightbox-modal" class="lightbox-overlay" onclick="closeLightbox(event)">
    <span class="lightbox-close" onclick="closeLightbox(event)">&times;</span>
    <div class="lightbox-container" onclick="event.stopPropagation()">
      <img id="lightbox-img" src="" alt="Full Screen View">
      <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>
  </div>

  <!-- SITE FOOTER -->
  <footer class="site-footer" style="margin-top: 40px;">
    <p>&copy; Dream To Build — All Rights Reserved.</p>
  </footer>

  <!-- DYNAMIC DATA LOADING SCRIPT -->
  <script>
    let currentItemData = null;

    async function loadDetailPage() {
      const urlParams = new URLSearchParams(window.location.search);
      const type = urlParams.get('type') || 'projects';
      const id = urlParams.get('id');

      if (!id) {
        document.getElementById('detail-title').textContent = 'Item Not Found';
        return;
      }

      try {
        let response;
        if (type === 'about') {
          response = await fetch(`data/siteData.json?v=${new Date().getTime()}`).catch(() => null);
          if (!response || !response.ok) {
            response = await fetch(`data/about.json?v=${new Date().getTime()}`);
          }
        } else {
          response = await fetch(`data/${type}.json?v=${new Date().getTime()}`);
        }

        const data = await response.json();
        
        if (Array.isArray(data)) {
          currentItemData = data.find(entry => entry.id === id);
        } else if (data[id]) {
          currentItemData = data[id];
        } else if (data.about && id === 'about') {
          currentItemData = data.about;
        }

        if (!currentItemData && type === 'about') {
          currentItemData = {
            id: "about",
            title: "About Dream To Build",
            subtitle: "Dragging High Concept Pretty Pictures Kicking and Screaming into the Real World",
            heroImage: "Projects/ScapeGoat at the Granary.jpg",
            narrative: [
              "Dream To Build is a custom vehicle design studio and fabrication workshop focused on bridging the gap between high-concept artistic visions and functional, street-and-strip realities.",
              "Every build documented here represents a unique synthesis of classic automotive styling, modern powertrain engineering, and custom metal fabrication."
            ]
          };
        }

        if (!currentItemData) {
          document.getElementById('detail-title').textContent = 'Entry Not Found';
          document.getElementById('detail-content').innerHTML = `<p>Could not locate item ID "${id}" in data/${type}.json.</p>`;
          return;
        }

        // Reset UI Elements explicitly
        document.getElementById('detail-specs-container').style.display = 'none';
        document.getElementById('sidebar-nav-right').style.display = 'none';
        document.getElementById('active-tab-display').style.display = 'none';
        document.getElementById('standard-gallery-container').style.display = 'none';

        // Render Base Details
        document.getElementById('detail-title').textContent = currentItemData.title || "Dream To Build";
        document.getElementById('detail-subtitle').textContent = currentItemData.subtitle || '';
        
        const heroImg = document.getElementById('detail-hero-img');
        heroImg.src = currentItemData.heroImage || currentItemData.thumb || "Projects/ScapeGoat at the Granary.jpg";
        heroImg.alt = currentItemData.title || "Detail View";

        // Render Narrative Paragraphs
        const contentDiv = document.getElementById('detail-content');
        if (Array.isArray(currentItemData.narrative)) {
          contentDiv.innerHTML = currentItemData.narrative.map(p => `<p style="margin-bottom: 1.25rem;">${p}</p>`).join('');
        } else if (currentItemData.summary) {
          contentDiv.innerHTML = `<p>${currentItemData.summary}</p>`;
        }

        const mainContainer = document.getElementById('detail-main-container');

        // 1. Render Specifications (Left Sidebar) if present across any section
        let hasSpecs = false;
        if (currentItemData.specifications) {
          const specsContainer = document.getElementById('detail-specs-container');
          const specsList = document.getElementById('detail-specs-list');
          specsList.innerHTML = Object.entries(currentItemData.specifications)
            .map(([key, value]) => `
              <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 6px;">
                <dt style="font-family: var(--font-spec); font-size: 0.8rem; color: var(--accent-cyan); text-transform: uppercase;">${key}</dt>
                <dd style="font-family: var(--font-spec); font-size: 0.95rem; color: #f0f4f8; margin-top: 2px;">${value}</dd>
              </div>`)
            .join('');
          specsContainer.style.display = 'flex';
          hasSpecs = true;
        }

        // 2. Handle Projects vs. Dreams/Fantasies/About Layouts & Galleries
        let hasRightNav = false;
        if (type === 'projects') {
          if (!currentItemData.subGalleries && currentItemData.gallery) {
            currentItemData.subGalleries = {
              history: {
                title: "Build Start & History",
                heroImage: currentItemData.heroImage || currentItemData.thumb,
                images: currentItemData.gallery
              }
            };
          }

          if (currentItemData.subGalleries || currentItemData.builderNotes) {
            const rightSidebar = document.getElementById('sidebar-nav-right');
            const tabsDiv = document.getElementById('gallery-tabs');
            rightSidebar.style.display = 'flex';
            tabsDiv.innerHTML = '';

            let firstKey = null;

            if (currentItemData.subGalleries) {
              Object.entries(currentItemData.subGalleries).forEach(([key, subVal], index) => {
                if (index === 0) firstKey = key;
                const tabBtn = document.createElement('button');
                tabBtn.className = `nav-text-link ${index === 0 ? 'active' : ''}`;
                tabBtn.textContent = subVal.title || key;
                tabBtn.onclick = () => switchTab(key);
                tabsDiv.appendChild(tabBtn);
              });
            }

            if (currentItemData.builderNotes) {
              const memberBtn = document.createElement('button');
              memberBtn.className = 'nav-text-link';
              memberBtn.style.borderColor = 'var(--accent-purple)';
              memberBtn.style.color = 'var(--accent-purple)';
              memberBtn.textContent = '🔒 Members Only';
              memberBtn.onclick = () => switchTab('members-only');
              tabsDiv.appendChild(memberBtn);
              if (!firstKey) firstKey = 'members-only';
            }

            if (firstKey) switchTab(firstKey);
            hasRightNav = true;
          }
        } else {
          // Render standard flat gallery for Dreams, Fantasies, About (Supports both string & object arrays)
          if (currentItemData.gallery && currentItemData.gallery.length > 0) {
            const galContainer = document.getElementById('standard-gallery-container');
            const galGrid = document.getElementById('standard-gallery-grid');
            galContainer.style.display = 'block';
            
            galGrid.innerHTML = currentItemData.gallery.map(item => {
              const imgSrc = typeof item === 'string' ? item : (item.url || item.path || item.image || '');
              if (!imgSrc) return '';
              
              const filename = imgSrc.split('/').pop().replace(/\.[^/.]+$/, "");
              return `
                <div style="background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 4px; overflow: hidden; cursor: pointer; height: 140px;" onclick="openLightbox('${imgSrc}', '${filename.replace(/'/g, "\\'")}')">
                  <img src="${imgSrc}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.onerror=null; this.src='Projects/ScapeGoat at the Granary.jpg';">
                </div>`;
            }).join('');
          }
        }

        // 3. Apply Clean CSS Grid Alignment based on active sidebars
        if (hasSpecs && hasRightNav) {
          mainContainer.className = 'detail-grid-layout';
          mainContainer.style.display = '';
        } else if (hasSpecs && !hasRightNav) {
          mainContainer.className = '';
          mainContainer.style.display = 'grid';
          mainContainer.style.gridTemplateColumns = '280px 1fr';
          mainContainer.style.gap = '24px';
          mainContainer.style.alignItems = 'start';
          mainContainer.style.width = '100%';
        } else {
          mainContainer.className = 'main-layout flex-column';
          mainContainer.style.display = '';
        }

      } catch (err) {
        console.error('Error loading detail view:', err);
        document.getElementById('detail-title').textContent = 'Error Loading Details';
      }
    }

    function switchTab(activeKey) {
      const displayArea = document.getElementById('active-tab-display');
      displayArea.style.display = 'block';
      displayArea.innerHTML = '';

      const tabsDiv = document.getElementById('gallery-tabs');
      Array.from(tabsDiv.children).forEach(btn => {
        if (btn.textContent.toLowerCase().includes(activeKey.toLowerCase()) || 
           (activeKey === 'members-only' && btn.textContent.includes('Members Only'))) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      if (activeKey === 'members-only') {
        displayArea.innerHTML = `
          <div id="builder-gate" style="text-align:center; padding: 12px;">
            <h3 style="color:var(--accent-purple); font-family:var(--font-spec); margin-bottom:12px;">Restricted Builder Access</h3>
            <p style="margin-bottom:16px; font-size:1.1rem;">Enter passcode to view confidential builder notes and fabrication instructions:</p>
            <input type="password" id="builder-pass" placeholder="Enter passcode..." style="padding:10px 14px; font-family:var(--font-spec); border:1px solid var(--border-color); border-radius:4px; background:var(--bg-color); color:#fff; width:220px; font-size:1rem; margin-right:8px;">
            <button onclick="unlockBuilderNotes()" style="padding:10px 18px; font-family:var(--font-spec); font-weight:bold; background:var(--accent-cyan); color:#000; border:none; border-radius:4px; cursor:pointer;">Unlock</button>
          </div>
          <div id="builder-content" style="display:none; border-top: 1px solid var(--border-color); padding-top: 16px; margin-top: 16px;">
            <h3 style="color:var(--accent-purple); font-family:var(--font-spec); margin-bottom:12px;">Confidential Builder Instructions</h3>
            <pre id="unlocked-notes" style="font-family:var(--font-spec); font-size:1.05rem; line-height:1.7; color:#f1f5f9; white-space:pre-wrap;"></pre>
          </div>`;
      } else if (currentItemData.subGalleries && currentItemData.subGalleries[activeKey]) {
        const subVal = currentItemData.subGalleries[activeKey];
        
        if (subVal.heroImage) {
          document.getElementById('detail-hero-img').src = subVal.heroImage;
        }

        let html = `<h3 style="font-family: var(--font-to); font-size: 1.4rem; color: #ffffff; margin-bottom: 16px;">${subVal.title || activeKey}</h3>`;
        
        if (subVal.images && subVal.images.length > 0) {
          html += `<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px;">` +
            subVal.images.map(item => {
              const imgSrc = typeof item === 'string' ? item : (item.url || item.path || item.image || '');
              if (!imgSrc) return '';
              const filename = imgSrc.split('/').pop().replace(/\.[^/.]+$/, "");
              return `
                <div style="background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 4px; overflow: hidden; cursor: pointer; height: 140px;" onclick="openLightbox('${imgSrc}', '${filename.replace(/'/g, "\\'")}')">
                  <img src="${imgSrc}" style="width: 100%; height: 100%; object-fit: cover;">
                </div>`;
            }).join('') + `</div>`;
        } else {
          html += `<p style="font-family: var(--font-editorial); color: var(--text-muted); font-style: italic;">No images available in this category yet.</p>`;
        }
        displayArea.innerHTML = html;
      }
    }

    function unlockBuilderNotes() {
      const pass = document.getElementById('builder-pass').value;
      if (pass === 'Marina') {
        document.getElementById('builder-gate').style.display = 'none';
        document.getElementById('builder-content').style.display = 'block';
        document.getElementById('unlocked-notes').textContent = currentItemData.builderNotes;
      } else {
        alert('Incorrect passcode.');
      }
    }

    /* LIGHTBOX CONTROLS */
    function openLightbox(imgSrc, captionText) {
      const modal = document.getElementById('lightbox-modal');
      const img = document.getElementById('lightbox-img');
      const caption = document.getElementById('lightbox-caption');

      img.src = imgSrc;
      caption.textContent = captionText || currentItemData.title;
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox(e) {
      const modal = document.getElementById('lightbox-modal');
      modal.style.display = 'none';
      document.body.style.overflow = 'auto';
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeLightbox();
      }
    });

    window.onload = loadDetailPage;
  </script>

</body>
</html>
