<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Build Detail | Dream To Build</title>
  
  <!-- GOOGLE FONTS IMPORT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Cinzel:wght@400;700&family=Great+Vibes&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <nav class="nav-container">
      <a href="index.html" id="detail-back-btn" class="back-link">&larr; Back to Gallery</a>
    </nav>
  </header>

  <main id="detail-container" class="detail-container">
    <article class="build-article">
      <header class="build-header">
        <span id="build-badge" class="badge"></span>
        <h1 id="build-title">Loading Build...</h1>
        <p id="build-subtitle" class="subtitle"></p>
      </header>

      <div class="hero-image-wrapper">
        <img id="build-image" src="" alt="Build Image Placeholder">
      </div>

      <section class="specs-section">
        <h2>Specifications</h2>
        <dl id="specs-grid" class="specs-grid">
          <!-- Dynamically populated by detail-loader.js -->
        </dl>
      </section>

      <section class="narrative-section">
        <h2>Overview &amp; Design Intent</h2>
        <div id="build-narrative">
          <!-- Dynamically populated by detail-loader.js -->
        </div>
      </section>

      <section id="gallery-section" class="gallery-section" style="display: none;">
        <h2>Gallery</h2>
        <div id="build-gallery" class="gallery-grid">
          <!-- Dynamically populated by detail-loader.js -->
        </div>
      </section>

      <footer class="build-footer">
        <div id="build-tags" class="tag-cloud"></div>
      </footer>
    </article>
  </main>

  <!-- Lightbox Modal for Gallery Previews -->
  <div id="image-modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true" tabindex="-1">
    <span id="modal-close" class="modal-close" aria-label="Close modal">&times;</span>
    <img id="modal-img" class="modal-content" alt="Enlarged view">
    <div id="modal-caption" class="modal-caption"></div>
  </div>

  <script src="detail-loader.js"></script>
</body>
</html>
